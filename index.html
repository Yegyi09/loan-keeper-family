<!doctype html>
<html><head><meta charset="utf-8"><title>Loan Keeper Secure Bridge</title></head>
<body style="margin:0;padding:0;background:transparent">
<script>
'use strict';
const ALLOWED_ORIGIN = <?!= JSON.stringify(origin) ?>;
const CHANNEL = <?!= JSON.stringify(channel) ?>;
// Apps Script HtmlService runs this page inside an inner sandbox iframe.
// The GitHub page is window.top, not window.parent.
function sendTop(kind, extra={}) {
  if(window.top===window.self)return;
  window.top.postMessage(Object.assign({kind,channel:CHANNEL},extra),ALLOWED_ORIGIN);
}
window.addEventListener('message', function(event) {
  if(event.origin!==ALLOWED_ORIGIN || event.source!==window.top)return;
  const m=event.data||{};
  if(m.channel!==CHANNEL)return;
  if(m.kind==='LK_PING'){sendTop('LK_READY');return;}
  if(m.kind!=='LK_RPC'||typeof m.id!=='string')return;
  google.script.run
    .withSuccessHandler(result=>sendTop('LK_REPLY',{id:m.id,result}))
    .withFailureHandler(error=>sendTop('LK_REPLY',{id:m.id,result:{ok:false,error:String(error&&error.message||error)}}))
    .secureRpc(m.request);
});
sendTop('LK_READY');
</script>
</body></html>
